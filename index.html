<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>X QR Studio</title>
  <!-- 安定したQRコード生成ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
      margin-top: 10px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    p.sub {
      font-size: 13px;
      color: #94a3b8;
    }
    .input-card {
      width: 100%;
      max-width: 400px;
      background: #1e293b;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
    }
    .input-wrapper {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 0 14px;
      transition: all 0.2s;
    }
    .input-wrapper:focus-within {
      border-color: #38bdf8;
    }
    .prefix {
      color: #64748b;
      font-weight: 700;
      font-size: 16px;
    }
    input[type="text"] {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      padding: 14px 8px;
      font-size: 16px;
      font-weight: 600;
    }
    .preview-container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 24px;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5);
    }
    .action-btn {
      width: 100%;
      max-width: 360px;
      margin-top: 20px;
      background: linear-gradient(135deg, #1d9bf0, #0c82d8);
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(29, 155, 240, 0.4);
      transition: transform 0.1s;
    }
    .action-btn:active {
      transform: scale(0.98);
    }
    .hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>X QR Studio</h1>
    <p class="sub">X用 高画質QRコード生成ツール</p>
  </header>

  <div class="input-card">
    <div class="input-group">
      <label for="username">X ユーザーID</label>
      <div class="input-wrapper">
        <span class="prefix">@</span>
        <input type="text" id="username" value="risu_3risu_3" placeholder="ユーザーIDを入力" autocomplete="off" autocapitalize="none">
      </div>
    </div>
  </div>

  <div class="preview-container">
    <canvas id="qrCanvas" width="800" height="1000"></canvas>
    <button class="action-btn" id="saveBtn">画像を保存・共有する</button>
    <p class="hint">※ ボタンを押すか、画像を長押しして保存できます</p>
  </div>

  <script>
    const usernameInput = document.getElementById('username');
    const canvas = document.getElementById('qrCanvas');
    const ctx = canvas.getContext('2d');
    const saveBtn = document.getElementById('saveBtn');

    function drawCard() {
      let rawUser = usernameInput.value.trim().replace(/^@/, '');
      const displayUser = rawUser ? `@${rawUser}` : '@username';
      const targetUrl = rawUser ? `https://x.com/${rawUser}` : 'https://x.com';

      // 1. キャンバス初期化
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 2. 背景グラデーション
      const bgGrad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      bgGrad.addColorStop(0, '#15202b');
      bgGrad.addColorStop(1, '#0b0f14');
      ctx.fillStyle = bgGrad;
      
      // 角丸外枠
      drawRoundedRect(ctx, 0, 0, canvas.width, canvas.height, 40);
      ctx.fill();

      // カード金色の枠線
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 12;
      drawRoundedRect(ctx, 10, 10, canvas.width - 20, canvas.height - 20, 32);
      ctx.stroke();

      // 3. 上部 Xロゴ
      ctx.fillStyle = '#ffffff';
      drawXLogo(ctx, canvas.width / 2, 110, 48);

      // 4. テキスト
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fef08a';
      ctx.font = 'bold 38px -apple-system, sans-serif';
      ctx.fillText('Follow me on X', canvas.width / 2, 200);

      ctx.fillStyle = '#fef08a';
      ctx.font = 'bold 34px -apple-system, sans-serif';
      ctx.fillText(displayUser, canvas.width / 2, 255);

      // 5. QRコード生成（Error Correction Level H: 30%欠けても復元可能）
      try {
        const qr = qrcode(0, 'H');
        qr.addData(targetUrl);
        qr.make();

        const count = qr.getModuleCount();
        const qrSize = 520;
        const margin = 30;
        const boxX = (canvas.width - qrSize) / 2;
        const boxY = 300;

        // QRの台座背景（黒）
        ctx.fillStyle = '#05070a';
        drawRoundedRect(ctx, boxX - margin, boxY - margin, qrSize + margin * 2, qrSize + margin * 2, 28);
        ctx.fill();
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 4;
        ctx.stroke();

        // QRコード描画
        const cellSize = qrSize / count;
        ctx.fillStyle = '#ffffff';

        for (let row = 0; row < count; row++) {
          for (let col = 0; col < count; col++) {
            if (qr.isDark(row, col)) {
              ctx.fillRect(
                boxX + col * cellSize,
                boxY + row * cellSize,
                cellSize + 0.5,
                cellSize + 0.5
              );
            }
          }
        }

        // 6. QR中央のXロゴアイコン
        const iconSize = 100;
        const iconX = canvas.width / 2;
        const iconY = boxY + qrSize / 2;

        ctx.fillStyle = '#05070a';
        ctx.beginPath();
        ctx.arc(iconX, iconY, iconSize / 2 + 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        drawXLogo(ctx, iconX, iconY, iconSize * 0.5);

      } catch (e) {
        console.error(e);
      }

      // 7. フッター
      ctx.fillStyle = '#64748b';
      ctx.font = '500 22px -apple-system, sans-serif';
      ctx.fillText('Scan with camera', canvas.width / 2, 900);

      ctx.fillStyle = '#475569';
      ctx.font = 'bold 18px -apple-system, sans-serif';
      ctx.fillText('X-QR STUDIO', canvas.width / 2, 940);
    }

    function drawRoundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawXLogo(ctx, cx, cy, size) {
      ctx.save();
      ctx.translate(cx, cy);
      const s = size / 2;
      ctx.beginPath();
      ctx.moveTo(-s, -s);
      ctx.lineTo(s * 0.6, s);
      ctx.lineTo(s, s);
      ctx.lineTo(-s * 0.6, -s);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(s, -s);
      ctx.lineTo(-s * 0.6, s);
      ctx.lineTo(-s, s);
      ctx.lineTo(s * 0.6, -s);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // イベント設定
    usernameInput.addEventListener('input', drawCard);

    // 画像保存・共有
    saveBtn.addEventListener('click', async () => {
      const dataUrl = canvas.toDataURL('image/png');
      
      if (navigator.share) {
        try {
          const blob = await (await fetch(dataUrl)).blob();
          const file = new File([blob], 'x-qr-code.png', { type: 'image/png' });
          await navigator.share({
            title: 'X QR Code',
            files: [file]
          });
          return;
        } catch (e) {
          // フォールバック
        }
      }

      // シェア非対応端末はダウンロード/別タブ
      const link = document.createElement('a');
      link.download = 'x-qr-code.png';
      link.href = dataUrl;
      link.click();
    });

    // 初期描画
    window.onload = drawCard;
  </script>
</body>
</html>
