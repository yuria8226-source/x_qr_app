<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>X QR Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a; color: #f8fafc; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; padding: 20px 16px 40px;
    }
    header { text-align: center; margin-bottom: 20px; margin-top: 10px; }
    h1 {
      font-size: 22px; font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px;
    }
    p.sub { font-size: 13px; color: #94a3b8; }
    .input-card {
      width: 100%; max-width: 360px; background: #1e293b; padding: 16px;
      border-radius: 16px; border: 1px solid #334155; margin-bottom: 20px;
    }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; font-weight: 600; color: #cbd5e1; }
    .input-wrapper {
      display: flex; align-items: center; background: #0f172a;
      border: 2px solid #334155; border-radius: 10px; padding: 0 12px;
    }
    .input-wrapper:focus-within { border-color: #38bdf8; }
    .prefix { color: #64748b; font-weight: 700; font-size: 16px; }
    input[type="text"] {
      width: 100%; background: transparent; border: none; outline: none;
      color: #ffffff; padding: 12px 6px; font-size: 16px; font-weight: 600;
    }
    .preview-container { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; }
    canvas { width: 100%; height: auto; border-radius: 20px; box-shadow: 0 15px 25px -5px rgba(0,0,0,0.5); }
    .action-btn {
      width: 100%; max-width: 360px; margin-top: 16px;
      background: linear-gradient(135deg, #1d9bf0, #0c82d8); color: #ffffff;
      border: none; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 700;
      cursor: pointer; box-shadow: 0 4px 12px rgba(29, 155, 240, 0.4);
    }
    .hint { font-size: 12px; color: #64748b; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>X QR Studio</h1>
    <p class="sub">X専用 高精度QRコード作成</p>
  </header>

  <div class="input-card">
    <div class="input-group">
      <label for="username">X ユーザーID</label>
      <div class="input-wrapper">
        <span class="prefix">@</span>
        <input type="text" id="username" value="gdyjbsDvd" placeholder="ユーザーIDを入力" autocomplete="off" autocapitalize="none">
      </div>
    </div>
  </div>

  <div class="preview-container">
    <canvas id="qrCanvas" width="800" height="1000"></canvas>
    <button class="action-btn" id="saveBtn">画像を共有・保存する</button>
    <p class="hint">※ 長押しでも画像を保存できます</p>
  </div>

  <script>
    // --- 安定版QRコード生成エンジン (内蔵型) ---
    var QRCodeLib = function() {
      function QR8bitByte(data) { this.mode = 4; this.data = data; }
      QR8bitByte.prototype = {
        getLength: function() { return new TextEncoder().encode(this.data).length; },
        write: function(buffer) {
          var bytes = new TextEncoder().encode(this.data);
          for (var i = 0; i < bytes.length; i++) buffer.put(bytes[i], 8);
        }
      };

      function QRCode(typeNumber, errorCorrectionLevel) {
        this.typeNumber = typeNumber;
        this.errorCorrectionLevel = errorCorrectionLevel;
        this.modules = null;
        this.moduleCount = 0;
        this.dataList = [];
      }

      QRCode.prototype = {
        addData: function(data) { this.dataList.push(new QR8bitByte(data)); },
        isDark: function(row, col) { return this.modules[row][col]; },
        getModuleCount: function() { return this.moduleCount; },
        make: function() {
          this.makeImpl(false, this.getBestMaskPattern());
        },
        makeImpl: function(test, maskPattern) {
          this.moduleCount = this.typeNumber * 4 + 17;
          this.modules = new Array(this.moduleCount);
          for (var row = 0; row < this.moduleCount; row++) {
            this.modules[row] = new Array(this.moduleCount);
          }
          this.setupPositionProbePattern(0, 0);
          this.setupPositionProbePattern(this.moduleCount - 7, 0);
          this.setupPositionProbePattern(0, this.moduleCount - 7);
          this.setupPositionAdjustPattern();
          this.setupTimingPattern();
          this.setupTypeInfo(test, maskPattern);
          if (this.typeNumber >= 7) this.setupTypeNumber(test);
          this.mapData(this.createData(this.typeNumber, this.errorCorrectionLevel, this.dataList), maskPattern);
        },
        setupPositionProbePattern: function(r, c) {
          for (var row = -1; row <= 7; row++) {
            if (r + row <= -1 || this.moduleCount <= r + row) continue;
            for (var col = -1; col <= 7; col++) {
              if (c + col <= -1 || this.moduleCount <= c + col) continue;
              if ((0 <= row && row <= 6 && (col == 0 || col == 6)) ||
                  (0 <= col && col <= 6 && (row == 0 || row == 6)) ||
                  (2 <= row && row <= 4 && 2 <= col && col <= 4)) {
                this.modules[r + row][c + col] = true;
              } else {
                this.modules[r + row][c + col] = false;
              }
            }
          }
        },
        setupTimingPattern: function() {
          for (var r = 8; r < this.moduleCount - 8; r++) {
            if (this.modules[r][6] != null) continue;
            this.modules[r][6] = (r % 2 == 0);
          }
          for (var c = 8; c < this.moduleCount - 8; c++) {
            if (this.modules[6][c] != null) continue;
            this.modules[6][c] = (c % 2 == 0);
          }
        },
        setupPositionAdjustPattern: function() {
          var pos = QRUtil.getPatternPosition(this.typeNumber);
          for (var i = 0; i < pos.length; i++) {
            for (var j = 0; j < pos.length; j++) {
              var row = pos[i], col = pos[j];
              if (this.modules[row][col] != null) continue;
              for (var r = -2; r <= 2; r++) {
                for (var c = -2; c <= 2; c++) {
                  this.modules[row + r][col + c] = (r == -2 || r == 2 || c == -2 || c == 2 || (r == 0 && c == 0));
                }
              }
            }
          }
        },
        setupTypeInfo: function(test, maskPattern) {
          var data = (this.errorCorrectionLevel << 3) | maskPattern;
          var bits = QRUtil.getBCHTypeInfo(data);
          for (var i = 0; i < 15; i++) {
            var mod = (!test && ((bits >> i) & 1) == 1);
            if (i < 6) this.modules[i][8] = mod;
            else if (i < 8) this.modules[i + 1][8] = mod;
            else this.modules[this.moduleCount - 15 + i][8] = mod;

            if (i < 8) this.modules[8][this.moduleCount - i - 1] = mod;
            else if (i < 9) this.modules[8][15 - i - 1 + 1] = mod;
            else this.modules[8][15 - i - 1] = mod;
          }
          this.modules[this.moduleCount - 8][8] = !test;
        },
        setupTypeNumber: function(test) {
          var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
          for (var i = 0; i < 18; i++) {
            var mod = (!test && ((bits >> i) & 1) == 1);
            this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
            this.modules[i % 3 + this.moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
          }
        },
        mapData: function(data, maskPattern) {
          var inc = -1, row = this.moduleCount - 1, bitIndex = 7, byteIndex = 0;
          for (var col = this.moduleCount - 1; col > 0; col -= 2) {
            if (col == 6) col--;
            while (true) {
              for (var c = 0; c < 2; c++) {
                if (this.modules[row][col - c] == null) {
                  var dark = false;
                  if (byteIndex < data.length) {
                    dark = (((data[byteIndex] >>> bitIndex) & 1) == 1);
                  }
                  if (QRUtil.getMask(maskPattern, row, col - c)) dark = !dark;
                  this.modules[row][col - c] = dark;
                  bitIndex--;
                  if (bitIndex == -1) { byteIndex++; bitIndex = 7; }
                }
              }
              row += inc;
              if (row < 0 || this.moduleCount <= row) { row -= inc; inc = -inc; break; }
            }
          }
        },
        getBestMaskPattern: function() {
          var minLostPoint = 0, bestMaskPattern = 0;
          for (var i = 0; i < 8; i++) {
            this.makeImpl(true, i);
            var lostPoint = QRUtil.getLostPoint(this);
            if (i == 0 || minLostPoint > lostPoint) { minLostPoint = lostPoint; bestMaskPattern = i; }
          }
          return bestMaskPattern;
        },
        createData: function(typeNumber, errorCorrectionLevel, dataList) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);
          var buffer = new QRBitBuffer();
          for (var i = 0; i < dataList.length; i++) {
            var data = dataList[i];
            buffer.put(data.mode, 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber));
            data.write(buffer);
          }
          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
          if (buffer.getLengthInBits() > totalDataCount * 8) throw new Error("Data overflow");
          if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) buffer.put(0, 4);
          while (buffer.getLengthInBits() % 8 != 0) buffer.putBit(false);
          while (true) {
            if (buffer.getLengthInBits() >= totalDataCount * 8) break;
            buffer.put(0xEC, 8);
            if (buffer.getLengthInBits() >= totalDataCount * 8) break;
            buffer.put(0x11, 8);
          }
          return QRUtil.createBytes(buffer, rsBlocks);
        }
      };

      var QRUtil = {
        PATTERN_POSITION_TABLE: [
          [],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50],
          [6,30,54],[6,32,58],[6,34,62],[6,26,46,66],[6,26,48,70],[6,26,50,74]
        ],
        G15: (1<<10)|(1<<8)|(1<<5)|(1<<4)|(1<<2)|(1<<1)|(1<<0),
        G18: (1<<12)|(1<<11)|(1<<10)|(1<<9)|(1<<8)|(1<<5)|(1<<2)|(1<<0),
        G15_MASK: (1<<14)|(1<<12)|(1<<10)|(1<<4)|(1<<1),
        getBCHTypeInfo: function(data) {
          var d = data << 10;
          while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
            d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15)));
          }
          return ((data << 10) | d) ^ QRUtil.G15_MASK;
        },
        getBCHTypeNumber: function(data) {
          var d = data << 12;
          while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
            d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18)));
          }
          return (data << 12) | d;
        },
        getBCHDigit: function(data) {
          var digit = 0;
          while (data != 0) { digit++; data >>>= 1; }
          return digit;
        },
        getPatternPosition: function(typeNumber) { return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1]; },
        getMask: function(maskPattern, i, j) {
          switch (maskPattern) {
            case 0: return (i + j) % 2 == 0;
            case 1: return i % 2 == 0;
            case 2: return j % 3 == 0;
            case 3: return (i + j) % 3 == 0;
            case 4: return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 == 0;
            case 5: return (i * j) % 2 + (i * j) % 3 == 0;
            case 6: return ((i * j) % 2 + (i * j) % 3) % 2 == 0;
            case 7: return ((i * j) % 3 + (i + j) % 2) % 2 == 0;
          }
        },
        getLostPoint: function(qr) {
          var moduleCount = qr.getModuleCount(), lostPoint = 0;
          for (var row = 0; row < moduleCount; row++) {
            for (var col = 0; col < moduleCount; col++) {
              var sameCount = 0, dark = qr.isDark(row, col);
              for (var r = -1; r <= 1; r++) {
                if (row + r < 0 || moduleCount <= row + r) continue;
                for (var c = -1; c <= 1; c++) {
                  if (col + c < 0 || moduleCount <= col + c || (r == 0 && c == 0)) continue;
                  if (dark == qr.isDark(row + r, col + c)) sameCount++;
                }
              }
              if (sameCount > 5) lostPoint += (3 + sameCount - 5);
            }
          }
          return lostPoint;
        },
        getLengthInBits: function(mode, type) { return 8; },
        createBytes: function(buffer, rsBlocks) {
          var offset = 0, maxDcCount = 0, maxEcCount = 0;
          var dcdata = new Array(rsBlocks.length), ecdata = new Array(rsBlocks.length);
          for (var r = 0; r < rsBlocks.length; r++) {
            var dcCount = rsBlocks[r].dataCount, ecCount = rsBlocks[r].totalCount - dcCount;
            maxDcCount = Math.max(maxDcCount, dcCount);
            maxEcCount = Math.max(maxEcCount, ecCount);
            dcdata[r] = new Array(dcCount);
            for (var i = 0; i < dcdata[r].length; i++) dcdata[r][i] = 0xff & buffer.buffer[i + offset];
            offset += dcCount;
            var rsPoly = QRUtil.getErrorCorrectionPolynomial(ecCount);
            var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);
            var modPoly = rawPoly.mod(rsPoly);
            ecdata[r] = new Array(rsPoly.getLength() - 1);
            for (var i = 0; i < ecdata[r].length; i++) {
              var modIndex = i + modPoly.getLength() - ecdata[r].length;
              ecdata[r][i] = (modIndex >= 0) ? modPoly.get(modIndex) : 0;
            }
          }
          var totalCodeCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) totalCodeCount += rsBlocks[i].totalCount;
          var data = new Array(totalCodeCount), index = 0;
          for (var i = 0; i < maxDcCount; i++) {
            for (var r = 0; r < rsBlocks.length; r++) {
              if (i < dcdata[r].length) data[index++] = dcdata[r][i];
            }
          }
          for (var i = 0; i < maxEcCount; i++) {
            for (var r = 0; r < rsBlocks.length; r++) {
              if (i < ecdata[r].length) data[index++] = ecdata[r][i];
            }
          }
          return data;
        },
        getErrorCorrectionPolynomial: function(errorCorrectionLength) {
          var a = new QRPolynomial([1], 0);
          for (var i = 0; i < errorCorrectionLength; i++) {
            a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0));
          }
          return a;
        }
      };

      function QRPolynomial(num, shift) {
        var offset = 0;
        while (offset < num.length && num[offset] == 0) offset++;
        this.num = new Array(num.length - offset + shift);
        for (var i = 0; i < num.length - offset; i++) this.num[i] = num[i + offset];
      }
      QRPolynomial.prototype = {
        get: function(index) { return this.num[index]; },
        getLength: function() { return this.num.length; },
        multiply: function(e) {
          var num = new Array(this.getLength() + e.getLength() - 1);
          for (var i = 0; i < this.getLength(); i++) {
            for (var j = 0; j < e.getLength(); j++) {
              num[i + j] ^= QRMath.glog(this.get(i)) + QRMath.glog(e.get(j)) < 255 ?
                QRMath.gexp(QRMath.glog(this.get(i)) + QRMath.glog(e.get(j))) :
                QRMath.gexp((QRMath.glog(this.get(i)) + QRMath.glog(e.get(j))) % 255);
            }
          }
          return new QRPolynomial(num, 0);
        },
        mod: function(e) {
          if (this.getLength() - e.getLength() < 0) return this;
          var ratio = QRMath.glog(this.get(0)) - QRMath.glog(e.get(0));
          var num = new Array(this.getLength());
          for (var i = 0; i < this.getLength(); i++) num[i] = this.get(i);
          for (var i = 0; i < e.getLength(); i++) {
            num[i] ^= QRMath.gexp(QRMath.glog(e.get(i)) + ratio);
          }
          return new QRPolynomial(num, 0).mod(e);
        }
      };

      function QRRSBlock(totalCount, dataCount) {
        this.totalCount = totalCount; this.dataCount = dataCount;
      }
      QRRSBlock.RS_BLOCK_TABLE = [
        [1,26,19],[1,26,16],[1,26,13],[1,26,9],
        [1,44,34],[1,44,28],[1,44,22],[1,44,16],
        [1,70,55],[1,70,44],[2,35,17],[2,35,13],
        [1,100,80],[2,50,32],[2,50,24],[4,25,9]
      ];
      QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectionLevel) {
        var rsBlock = QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + errorCorrectionLevel];
        var list = [];
        for (var i = 0; i < rsBlock[0]; i++) list.push(new QRRSBlock(rsBlock[1], rsBlock[2]));
        return list;
      };

      function QRBitBuffer() { this.buffer = []; this.length = 0; }
      QRBitBuffer.prototype = {
        get: function(index) { return ((this.buffer[Math.floor(index / 8)] >>> (7 - index % 8)) & 1) == 1; },
        put: function(num, length) {
          for (var i = 0; i < length; i++) this.putBit(((num >>> (length - i - 1)) & 1) == 1);
        },
        getLengthInBits: function() { return this.length; },
        putBit: function(bit) {
          var bufIndex = Math.floor(this.length / 8);
          if (this.buffer.length <= bufIndex) this.buffer.push(0);
          if (bit) this.buffer[bufIndex] |= (0x80 >>> (this.length % 8));
          this.length++;
        }
      };

      var QRMath = {
        glog: function(n) { return LOG[n]; },
        gexp: function(n) { return EXP[n]; }
      };
      var EXP = new Array(256), LOG = new Array(256);
      for (var i = 0; i < 8; i++) EXP[i] = 1 << i;
      for (var i = 8; i < 256; i++) EXP[i] = EXP[i - 4] ^ EXP[i - 5] ^ EXP[i - 6] ^ EXP[i - 8];
      for (var i = 0; i < 255; i++) LOG[EXP[i]] = i;

      return QRCode;
    }();

    // --- メイン描画処理 ---
    const usernameInput = document.getElementById('username');
    const canvas = document.getElementById('qrCanvas');
    const ctx = canvas.getContext('2d');
    const saveBtn = document.getElementById('saveBtn');

    function drawCard() {
      const rawUser = usernameInput.value.trim().replace(/^@/, '');
      const displayUser = rawUser ? `@${rawUser}` : '@username';
      const targetUrl = rawUser ? `https://x.com/${rawUser}` : 'https://x.com';

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. 背景グラデーション
      const bgGrad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      bgGrad.addColorStop(0, '#15202b'); bgGrad.addColorStop(1, '#0b0f14');
      ctx.fillStyle = bgGrad;
      drawRoundedRect(ctx, 0, 0, canvas.width, canvas.height, 40); ctx.fill();

      // 2. 外枠（ゴールド）
      ctx.strokeStyle = '#d97706'; ctx.lineWidth = 12;
      drawRoundedRect(ctx, 10, 10, canvas.width - 20, canvas.height - 20, 32); ctx.stroke();

      // 3. ヘッダーロゴ & テキスト
      ctx.fillStyle = '#ffffff'; drawXLogo(ctx, canvas.width / 2, 110, 48);

      ctx.textAlign = 'center'; ctx.fillStyle = '#fef08a';
      ctx.font = 'bold 38px -apple-system, sans-serif';
      ctx.fillText('Follow me on X', canvas.width / 2, 200);

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 34px -apple-system, sans-serif';
      ctx.fillText(displayUser, canvas.width / 2, 255);

      // 4. 高精度QR生成 (Error Correction Level H = 2, Type 4 = 33x33)
      const qr = new QRCodeLib(4, 2);
      qr.addData(targetUrl);
      qr.make();

      const count = qr.getModuleCount();
      const qrSize = 500;
      const boxX = (canvas.width - qrSize) / 2;
      const boxY = 310;
      const cellSize = qrSize / count;

      // QR背景（白角丸）
      const padding = 24;
      ctx.fillStyle = '#ffffff';
      drawRoundedRect(ctx, boxX - padding, boxY - padding, qrSize + padding * 2, qrSize + padding * 2, 24);
      ctx.fill();

      // QRセル（黒）
      ctx.fillStyle = '#000000';
      for (let r = 0; r < count; r++) {
        for (let c = 0; c < count; c++) {
          if (qr.isDark(r, c)) {
            ctx.fillRect(boxX + c * cellSize, boxY + r * cellSize, cellSize + 0.5, cellSize + 0.5);
          }
        }
      }

      // 5. 中央のロゴアイコン
      const logoBgSize = 96;
      const logoX = canvas.width / 2;
      const logoY = boxY + qrSize / 2;

      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(logoX, logoY, logoBgSize / 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      drawXLogo(ctx, logoX, logoY, 44);

      // 6. フッター
      ctx.fillStyle = '#64748b';
      ctx.font = '500 22px -apple-system, sans-serif';
      ctx.fillText('Scan with camera', canvas.width / 2, 900);

      ctx.fillStyle = '#475569';
      ctx.font = 'bold 18px -apple-system, sans-serif';
      ctx.fillText('X-QR STUDIO', canvas.width / 2, 940);
    }

    function drawRoundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawXLogo(ctx, cx, cy, size) {
      ctx.save();
      ctx.translate(cx, cy);
      const s = size / 2;
      ctx.beginPath();
      ctx.moveTo(-s, -s); ctx.lineTo(s * 0.6, s); ctx.lineTo(s, s); ctx.lineTo(-s * 0.6, -s);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(s, -s); ctx.lineTo(-s * 0.6, s); ctx.lineTo(-s, s); ctx.lineTo(s * 0.6, -s);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    usernameInput.addEventListener('input', drawCard);

    saveBtn.addEventListener('click', async () => {
      const dataUrl = canvas.toDataURL('image/png');
      if (navigator.share) {
        try {
          const blob = await (await fetch(dataUrl)).blob();
          const file = new File([blob], 'x-qr-code.png', { type: 'image/png' });
          await navigator.share({ title: 'X QR Code', files: [file] });
          return;
        } catch (e) {}
      }
      const link = document.createElement('a');
      link.download = 'x-qr-code.png';
      link.href = dataUrl;
      link.click();
    });

    window.onload = drawCard;
    drawCard();
  </script>
</body>
</html>
